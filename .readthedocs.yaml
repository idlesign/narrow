version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_install:
      - pip install uv
    install:
      - UWSGI_BUILD_CORES=2 uv sync --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python" --no-default-groups --group docs
    build:
      html:
        - uv run --no-sync mkdocs build --strict --site-dir "$READTHEDOCS_OUTPUT/html"

mkdocs:
  configuration: mkdocs.yml
